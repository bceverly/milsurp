# Dependency updates.
#
# Three ecosystems, all on a weekly cadence. Updates are grouped so a week's
# patches arrive as one reviewable PR rather than a dozen, with the exception of
# major versions, which are always separate because they need real review.

version: 2

updates:
  # --------------------------------------------------------------- Python ---
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "deps(python)"
    groups:
      # One PR a week for Python, not one per dependency.
      #
      # This used to carry `update-types: [minor, patch]` and quietly matched
      # nothing. Requirements here are floors -- `SQLAlchemy>=2.0.36,<3.0` --
      # so when a release already satisfies the range there is no version to
      # update and dependabot raises the floor instead. A floor bump has no
      # semver update-type to match on, so every one of them fell outside the
      # group: five landed as five separate PRs on 2026-09-13, each changing a
      # number that pip was already resolving to anyway.
      #
      # Without `update-types` the group takes everything it is offered, which
      # is the behavior the comment above always claimed.
      python:
        patterns: ["*"]
    ignore:
      # Majors get their own PR so the changelog actually gets read.
      #
      # Same blind spot, and it is worth knowing about rather than assuming
      # this covers everything: `version-update:semver-major` matches a
      # version change, so a *floor* raised across a major boundary is not
      # ignored. mypy went `>=1.14` to `>=2.3.1` that way. It now rides in the
      # weekly group instead of arriving alone -- so read the group PR's list
      # rather than trusting that anything major would have been split out.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # ----------------------------------------------------------------- Node ---
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      # React and the router move together; splitting them produces PRs that
      # cannot pass CI on their own.
      react:
        patterns: ["react", "react-dom", "react-router-dom"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # ------------------------------------------------------- GitHub Actions ---
  # Pinned action versions rot silently and are a supply-chain surface of their
  # own, so they are updated on the same cadence as everything else.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
