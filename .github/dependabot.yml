# Dependency updates.
#
# Three ecosystems, all on a weekly cadence. Updates are grouped so a week's
# patches arrive as one reviewable PR rather than a dozen, with the exception of
# major versions, which are always separate because they need real review.

version: 2

updates:
  # --------------------------------------------------------------- Python ---
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "deps(python)"
    groups:
      # Patch and minor bumps are almost always safe and are what the weekly
      # security scan wants applied promptly.
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Majors get their own PR so the changelog actually gets read.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # ----------------------------------------------------------------- Node ---
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      # React and the router move together; splitting them produces PRs that
      # cannot pass CI on their own.
      react:
        patterns: ["react", "react-dom", "react-router-dom"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # ------------------------------------------------------- GitHub Actions ---
  # Pinned action versions rot silently and are a supply-chain surface of their
  # own, so they are updated on the same cadence as everything else.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
