# Lint, tests and schema checks on every push and pull request.
#
# Each concern is its own job so a failure names itself in the checks list, and
# so they run in parallel. The one exception is the test job, which runs the
# backend and frontend suites as two steps of a single job — that mirrors
# `make test` and keeps their coverage gates reported together.
#
# The test job fans out across every supported Python, one job per version, so
# "Unit tests (Python 3.13)" names the broken interpreter in the checks list
# without anyone opening a log.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here needs write access to the repository.
permissions:
  contents: read

env:
  # The version the jobs that are not version-specific run on. It tracks what
  # developers and the production server actually execute (Ubuntu 26.04 ships
  # 3.14), rather than the oldest one still supported — a bug that only appears
  # on the version everyone runs should not need a matrix leg to be noticed.
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"
  MILSURP_ENV: dev

jobs:
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r backend/requirements-dev.txt
          cd frontend && npm ci --no-audit --no-fund

      # scripts/lint.sh skips any tool that is not installed, so shellcheck is
      # installed here to make sure it actually runs rather than being skipped.
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # black --check first, then ruff, mypy, bandit, prettier, eslint,
      # shellcheck and a YAML parse. Any finding fails.
      - name: make lint
        run: make lint

  # ==========================================================================
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the others: knowing it breaks on
      # 3.12 *and* passes on 3.14 is the whole point of running all three.
      fail-fast: false
      matrix:
        # Every version pyproject's requires-python claims. A floor nobody
        # tests is not a floor.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r backend/requirements-dev.txt
          cd frontend && npm ci --no-audit --no-fund

      # OCR for the flyer-reading vendor. A system package, not a Python one,
      # so pip does not bring it: without it six of the Hunter's Lodge tests
      # skip and the whole flyer reader goes unexercised here.
      - name: Install tesseract
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium

      # Together these are `make test`. Split into two steps so the checks list
      # says which suite failed without anyone opening the log.
      - name: Backend tests (pytest, 65% gate)
        run: make test-backend

      # Runs even if the backend failed, so one push reports both suites.
      - name: Frontend tests (Playwright, 65% gate)
        if: always()
        run: make test-frontend

      - name: Upload coverage and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-py${{ matrix.python-version }}
          path: |
            coverage-backend.xml
            coverage-backend.json
            frontend/coverage/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ==========================================================================
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r backend/requirements.txt

      # Alembic builds the schema even on a brand new database, so this also
      # proves a fresh install works.
      - name: Build the database from scratch
        run: .venv/bin/python scripts/dbupdate.py

      # Every migration is written to be re-runnable; prove it rather than
      # trusting the comment.
      - name: Re-run migrations (must be a no-op)
        run: .venv/bin/python scripts/dbupdate.py

      - name: Confirm nothing is outstanding
        run: .venv/bin/python scripts/dbupdate.py --check

      - name: Confirm the models match the migrations
        run: |
          .venv/bin/python - <<'PY'
          import sys
          sys.path.insert(0, "backend")
          import sqlalchemy as sa
          from app.database import Base, get_engine
          from app import models  # noqa: F401  (registers every model)

          inspector = sa.inspect(get_engine())
          in_db = set(inspector.get_table_names()) - {"alembic_version"}
          in_models = set(Base.metadata.tables)

          problems = []
          if in_db != in_models:
              problems.append(
                  f"tables differ: only-db={sorted(in_db - in_models)} "
                  f"only-models={sorted(in_models - in_db)}"
              )
          for table in sorted(in_db & in_models):
              db_cols = {c["name"] for c in inspector.get_columns(table)}
              model_cols = set(Base.metadata.tables[table].columns.keys())
              if db_cols != model_cols:
                  problems.append(
                      f"{table}: only-db={sorted(db_cols - model_cols)} "
                      f"only-models={sorted(model_cols - db_cols)}"
                  )
          if problems:
              print("Schema drift between the models and the migrations:")
              for line in problems:
                  print(f"  {line}")
              sys.exit(1)
          print("Models and migrations agree.")
          PY

  # ==========================================================================
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend bundle
        run: cd frontend && npm ci --no-audit --no-fund && npm run build

      # The test job builds with COVERAGE=1, which is instrumented. This checks
      # the bundle that would actually ship.
      - name: Confirm the bundle is not instrumented
        run: |
          if grep -rqs "__coverage__" frontend/dist/assets/; then
            echo "::error::The production bundle contains istanbul instrumentation."
            exit 1
          fi
          echo "Production bundle is clean."
