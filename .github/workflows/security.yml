# Security scanning.
#
# The `security` job runs exactly what `make security` runs locally — same
# script, same tools, same thresholds — so a clean local run means a clean CI
# run. The tools are installed first, because scripts/security.sh *skips* any
# tool it cannot find; without installing them the job would pass by doing
# nothing.
#
# Everything that is not part of `make security` gets its own job.

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC. Dependencies rot without any commit of ours, so this
    # catches a newly-disclosed CVE in code that has not changed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches ci.yml: the version developers and the production server run.
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

jobs:
  # ==========================================================================
  # bandit · semgrep · Snyk · pip-audit · npm audit · gitleaks · config checks
  # ==========================================================================
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, which the default single-commit checkout
          # does not provide.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r backend/requirements-dev.txt
          cd frontend && npm ci --no-audit --no-fund

      # scripts/security.sh looks for each of these and reports "skipped" when
      # absent, so they must all be present for the job to mean anything.
      # Same requirements file and same pinned gitleaks as `make install-dev`,
      # so a clean local scan and a clean CI scan mean the same thing.
      - name: Install the scanners
        run: |
          .venv/bin/pip install --quiet -r backend/requirements-security.txt
          . scripts/tool-versions.env
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          npm install -g snyk >/dev/null 2>&1 || echo "::warning::snyk install failed; it will be skipped"

      # semgrep and pip-audit live in the venv; put it on PATH so the script
      # finds them the same way it does locally.
      - name: make security
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          make security

      - name: Upload scanner reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: .security-reports/
          retention-days: 30
          if-no-files-found: ignore

  # ==========================================================================
  # Not part of `make security`: too heavy to run on a laptop, and it reports
  # into GitHub's own code-scanning UI rather than to stdout.
  # ==========================================================================
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
