# gitleaks configuration for Milsurp Monitor.
#
# The default ruleset plus a few project-specific allowances, so `make security`
# does not cry wolf about documented placeholders while still catching a real
# credential that slipped into a tracked file.

title = "Milsurp Monitor"

[extend]
useDefault = true

[[rules]]
id = "milsurp-smtp-password"
description = "SMTP password committed in a YAML file"
# Catches a real Gmail app password (16 chars, often written in 4-char groups)
# assigned to a password key.
#
# gitleaks compiles with Go's RE2, which has no lookaround: the documented
# placeholders are excluded by [allowlist].regexes below rather than by a
# (?!...) group. (?m) is required because gitleaks matches against whole file
# contents, so a bare ^ would only ever anchor to the first line.
regex = '''(?im)^\s*(?:smtp_)?password:\s*["']?([A-Za-z0-9@#$%^&*!_\-]{8,}|(?:[a-z]{4}\s){3}[a-z]{4})["']?\s*$'''
path = '''\.ya?ml$'''
tags = ["smtp", "credential"]

[[rules]]
id = "milsurp-signing-secret"
description = "JWT secret or password pepper committed"
regex = '''(?im)^\s*(?:jwt_secret|password_pepper|secret_key):\s*["']?([A-Za-z0-9+/=_\-]{24,})["']?\s*$'''
path = '''\.ya?ml$'''
tags = ["secret"]

[allowlist]
description = "Documented placeholders, test fixtures and generated assets"
# Match the whole matched line, not just the captured secret, so a placeholder
# is recognized however it is quoted.
regexTarget = "line"

paths = [
  # The sample config exists to be read; its values are placeholders.
  '''config\.yaml\.sample''',
  # The *local* config file holds real secrets on purpose, and `make security`
  # scans the working tree, so without this every developer's scan reports a
  # leak that cannot possibly be committed — which is how a scanner gets muted.
  # It is gitignored, and scripts/security.sh separately asserts that it still
  # is (the "Local checks" section), so nothing is actually unwatched here.
  '''^config\.yaml$''',
  '''^config\.local\.yaml$''',
  '''\.local\.yaml$''',
  # Test fixtures use obvious throwaway values.
  '''backend/tests/.*''',
  # Documentation quotes the sample values.
  '''README\.md''',
  '''TODO\.md''',
  '''ROADMAP\.md''',
  # Lockfiles are full of base64 integrity hashes.
  '''package-lock\.json''',
  '''node_modules/.*''',
  '''\.venv/.*''',
  '''dist/.*''',
]

regexes = [
  # The placeholders the sample config and the installers deliberately ship.
  '''CHANGE-ME-run-make-secrets''',
  '''set-a-long-passphrase-here''',
  '''abcd efgh ijkl mnop''',
  # Test-only credentials, named so they are obviously not real.
  '''test-(?:pepper|jwt-secret|admin-passphrase)''',
  '''correct-horse-battery-staple''',
]
