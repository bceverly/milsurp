[pytest]
testpaths = tests
pythonpath = .
addopts =
    --strict-markers
    --strict-config
    -ra
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=xml:../coverage-backend.xml
    --cov-report=json:../coverage-backend.json
    # The floor the project commits to. Raising it is a deliberate act, and
    # this is one: the suite has been at 88% for a while and a 65% floor means
    # twenty-three points of regression pass CI silently. Set five below the
    # measured figure, which is the room a legitimately thinner new module
    # needs without the gate becoming something to argue with.
    --cov-fail-under=83
# Every warning is an error. A warning is the library telling us something is
# wrong or about to break; letting them scroll past defeats the point.
# Add a targeted `ignore::` line here only for third-party noise we cannot fix,
# with a comment saying why.
filterwarnings =
    error
    # Starlette's TestClient still imports anyio.abc.BlockingPortal, which anyio
    # has deprecated in favor of anyio.from_thread.BlockingPortal. Nothing in
    # this project can fix it; remove this line once Starlette updates.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
markers =
    slow: tests that take more than a second
    network: tests that reach a real vendor site (not run in CI)
