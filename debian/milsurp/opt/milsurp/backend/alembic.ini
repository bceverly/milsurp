# Alembic configuration.
#
# The database URL is NOT set here: it comes from the application's own config
# file at runtime (see alembic/env.py), so migrations always target whatever
# database.path resolves to for the current mode.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
# Migration filenames are prefixed with a zero-padded, monotonic revision id so
# the directory listing matches the apply order.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
