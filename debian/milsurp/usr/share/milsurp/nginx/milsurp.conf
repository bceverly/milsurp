# =============================================================================
# Milsurp Monitor — nginx site configuration (production, TLS)
#
# Install:  /etc/nginx/sites-available/milsurp  ->  sites-enabled/
# Applied automatically by scripts/setup-letsencrypt.sh once a certificate
# exists. Before that, milsurp-bootstrap.conf serves plain HTTP so the ACME
# challenge can complete.
#
# Replace milsurpmonitor.com throughout if you use a different domain (the
# install scripts do this substitution for you).
# =============================================================================

# Rate-limit zones. Defined here at http-scope-compatible level; if your nginx
# build rejects limit_req_zone inside a server block, move these two lines into
# /etc/nginx/nginx.conf's http {} block.
limit_req_zone $binary_remote_addr zone=milsurp_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=milsurp_api:10m   rate=120r/m;

upstream milsurp_app {
    # The application binds loopback only; nginx is the sole way in.
    server 127.0.0.1:8730 fail_timeout=0;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# Port 80 — everything is 301-redirected to HTTPS, except the ACME challenge.
# -----------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name milsurpmonitor.com www.milsurpmonitor.com;

    # Let's Encrypt renewal must stay reachable over plain HTTP, so this one
    # path is served rather than redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        # 301, not 302: this is permanent, and it lets browsers and HSTS
        # preloading cache the upgrade.
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# Port 443 — the application.
# -----------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name milsurpmonitor.com www.milsurpmonitor.com;

    # --- TLS -----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/milsurpmonitor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milsurpmonitor.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/milsurpmonitor.com/chain.pem;

    # TLS 1.2 is the floor; 1.0/1.1 are deprecated and broken.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve            X25519:secp384r1;
    ssl_dhparam               /etc/nginx/dhparam.pem;

    ssl_session_cache   shared:MilsurpTLS:10m;
    ssl_session_timeout 1d;
    # Tickets are disabled because they weaken forward secrecy unless the keys
    # are rotated, and nginx does not rotate them on its own.
    ssl_session_tickets off;

    # OCSP stapling: the browser gets revocation status from us rather than
    # making its own request to the CA.
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # --- Security headers ----------------------------------------------------
    # Two years, subdomains included, preload-eligible. Only safe once you are
    # certain every subdomain can serve HTTPS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # The app is a self-contained SPA: no third-party scripts, styles, fonts or
    # frames, and every image is served from this origin through the
    # authenticated photo endpoint. 'unsafe-inline' for styles is required by
    # React's inline style attributes; scripts do NOT get it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Do not advertise the exact nginx version to scanners.
    server_tokens off;

    # --- Uploads / limits ----------------------------------------------------
    # Nothing here accepts uploads; a small cap blunts request-body attacks.
    client_max_body_size 1m;
    client_body_timeout  20s;
    client_header_timeout 20s;
    send_timeout          60s;

    # --- Logging -------------------------------------------------------------
    access_log /var/log/nginx/milsurp.access.log;
    error_log  /var/log/nginx/milsurp.error.log warn;

    # --- Compression ---------------------------------------------------------
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       text/plain text/css text/javascript application/javascript
                     application/json application/xml image/svg+xml;

    # --- Proxy defaults ------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_redirect off;

    # --- Sign-in: the endpoint worth brute-forcing ---------------------------
    # The application throttles per (username, IP) as well; this is the outer
    # layer that stops the request reaching Python at all.
    location = /api/auth/login {
        limit_req zone=milsurp_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://milsurp_app;
    }

    # The one unauthenticated endpoint that sends mail.
    location = /api/access-request {
        limit_req zone=milsurp_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://milsurp_app;
    }

    # --- Photos: large, immutable, and authenticated -------------------------
    location ~ ^/api/items/\d+/photos/ {
        proxy_pass http://milsurp_app;
        # Photos are read from disk and streamed; buffering the whole file in
        # nginx would waste memory for no benefit.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # --- Everything else under /api -----------------------------------------
    location /api/ {
        limit_req zone=milsurp_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://milsurp_app;
        # A manual scan is kicked off in the background, but the request that
        # starts it can still wait a couple of seconds for the run id.
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # --- Static bundle -------------------------------------------------------
    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        alias /opt/milsurp/frontend/dist/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        alias /opt/milsurp/frontend/dist/favicon.svg;
        access_log off;
        expires 7d;
    }

    # --- The SPA -------------------------------------------------------------
    location / {
        root /opt/milsurp/frontend/dist;
        # Client-side routing: any unknown path renders the app shell and React
        # decides what it means.
        try_files $uri /index.html;
        # index.html must never be cached, or a deploy leaves browsers loading
        # asset filenames that no longer exist.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Deny anything that looks like a probe for source or dotfiles.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
