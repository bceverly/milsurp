# =============================================================================
# Milsurp Monitor — nginx site configuration (TLS terminated upstream)
#
# Install:  /etc/nginx/sites-available/milsurp  ->  sites-enabled/
#           nginx -t && systemctl reload nginx
#
# Use this when something in front of this machine already terminates TLS --
# an HAProxy on a pfSense box, a load balancer, a tunnel. It is the same
# configuration as milsurp.conf with the TLS and redirect machinery removed,
# because the certificate lives on the terminator and never reaches here.
#
# **This file exists because its absence took the site down.** milsurp.conf is
# installed by scripts/setup-letsencrypt.sh, which only runs when certbot gets
# a certificate on this host. A deployment terminating TLS upstream never runs
# it, so it keeps milsurp-bootstrap.conf -- meant to last the few minutes
# until a certificate exists -- as its permanent production configuration.
# That file has no rate limiting, no photo location, no upstream keepalive and
# no security headers. Nothing announces this; the site works, and then one
# day a browse page opens 192 thumbnails at once and the answer is 504.
#
# Replace milsurpmonitor.com throughout if you use a different domain.
#
# ## What the terminator has to send
#
#   X-Forwarded-Proto   https     -- or the app builds http:// links
#   X-Forwarded-For     client IP -- or every request looks like it came
#                                    from the proxy, and the login rate limit
#                                    throttles the whole internet as one
#
# ## And what it has to wait for
#
# Set the terminator's own server-side timeout to **at least 120 seconds**.
# HAProxy's `timeout server` defaults to 30s in the pfSense package; a manual
# scan's start request can legitimately take longer than that, and when the
# terminator gives up first the browser is shown a 504 while this nginx logs
# a 499 -- the same event, recorded at both ends, and easy to spend an evening
# chasing from the wrong side.
# =============================================================================

limit_req_zone $binary_remote_addr zone=milsurp_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=milsurp_api:10m   rate=120r/m;

upstream milsurp_app {
    # The application binds loopback only; nginx is the sole way in.
    server 127.0.0.1:8730 fail_timeout=0;

    # See milsurp.conf: a browse page opens one request per thumbnail, which
    # is far more than the 16 nginx keeps warm by default.
    keepalive 64;
    keepalive_requests 1000;
}

server {
    listen      80;
    listen      [::]:80;
    server_name milsurpmonitor.com www.milsurpmonitor.com;

    # --- Trust the terminator ------------------------------------------------
    # Only the proxy in front may set these. Replace with its address: with
    # anything else able to reach port 80, a forged X-Forwarded-For would let
    # a client pick its own rate-limit bucket.
    #   set_real_ip_from 192.168.1.1;
    #   real_ip_header   X-Forwarded-For;
    #   real_ip_recursive on;

    # --- Security headers ----------------------------------------------------
    # No Strict-Transport-Security here: HSTS is the terminator's to send,
    # since it owns the TLS connection the browser actually made.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-Frame-Options            "DENY" always;
    add_header Referrer-Policy            "no-referrer" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    server_tokens off;

    # --- Uploads / limits ----------------------------------------------------
    client_max_body_size  1m;
    client_body_timeout   20s;
    client_header_timeout 20s;
    send_timeout          60s;

    # --- Logging -------------------------------------------------------------
    access_log /var/log/nginx/milsurp.access.log;
    error_log  /var/log/nginx/milsurp.error.log warn;

    # --- Compression ---------------------------------------------------------
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       text/plain text/css text/javascript application/javascript
                     application/json application/xml image/svg+xml;

    # --- Proxy defaults ------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # $scheme is "http" on this hop; what the browser used is what matters, so
    # pass the terminator's header through and fall back to http only when it
    # sent nothing.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection        "";

    # --- Sign-in: the endpoint worth brute-forcing ---------------------------
    location = /api/auth/login {
        limit_req zone=milsurp_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://milsurp_app;
    }

    # The one unauthenticated endpoint that sends mail.
    location = /api/access-request {
        limit_req zone=milsurp_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://milsurp_app;
    }

    # --- Photos: large, immutable, and authenticated -------------------------
    # Deliberately outside the /api/ rate limit: one page legitimately asks for
    # a hundred of these, and throttling them would break ordinary browsing.
    location ~ ^/api/items/\d+/photos/ {
        proxy_pass http://milsurp_app;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # --- Everything else under /api -----------------------------------------
    location /api/ {
        limit_req zone=milsurp_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://milsurp_app;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # --- Static bundle -------------------------------------------------------
    location /assets/ {
        alias /opt/milsurp/frontend/dist/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        alias /opt/milsurp/frontend/dist/favicon.svg;
        access_log off;
        expires 7d;
    }

    # --- The SPA -------------------------------------------------------------
    location / {
        root /opt/milsurp/frontend/dist;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
