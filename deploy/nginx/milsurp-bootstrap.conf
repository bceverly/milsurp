# =============================================================================
# Milsurp Monitor — HTTP-only bootstrap nginx configuration.
#
# Used only on a fresh machine, between running install-production.sh and
# obtaining a certificate. A config that references a certificate file which
# does not exist yet fails `nginx -t`, so nginx cannot start to serve the ACME
# challenge that would create it — this config breaks that circle.
#
# scripts/setup-letsencrypt.sh replaces this with milsurp.conf once the
# certificate is issued.
# =============================================================================

upstream milsurp_app {
    server 127.0.0.1:8730 fail_timeout=0;
    keepalive 16;
}

server {
    listen      80;
    listen      [::]:80;
    server_name milsurpmonitor.com www.milsurpmonitor.com;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/milsurp.access.log;
    error_log  /var/log/nginx/milsurp.error.log warn;

    # The ACME HTTP-01 challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location /api/ {
        proxy_pass http://milsurp_app;
        proxy_read_timeout 90s;
    }

    location /assets/ {
        alias /opt/milsurp/frontend/dist/assets/;
        access_log off;
        try_files $uri =404;
    }

    location / {
        root /opt/milsurp/frontend/dist;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
