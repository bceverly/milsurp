# Milsurp Monitor host: sshd hardening. Install as
# /etc/ssh/sshd_config.d/10-milsurp-hardening.conf, then `sshd -t` and
# `systemctl reload ssh`. Earlier files in sshd_config.d win, so this one is
# numbered ahead of cloud-init's 50-.
#
# Keys only: the stock Ubuntu cloud image already sets these, and they are
# repeated so a host built some other way gets them too.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
# Nothing on this server needs a display, and forwarding one is a channel back
# to whoever connects.
X11Forwarding no
# A client offering several keys still gets in within three.
MaxAuthTries 3
