<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 62" role="img"
     aria-label="Milsurp Monitor">
  <title>Milsurp Monitor</title>
  <desc>US Air Force Senior Airman insignia: a central hub bearing an outlined
        star, with three-striped wings either side.</desc>
  <defs>
    <clipPath id="ms-wings">
      <polygon points="2.00,1.45 56.00,32.61 44.00,53.39 2.00,29.15"/>
      <polygon points="98.00,1.45 44.00,32.61 56.00,53.39 98.00,29.15"/>
    </clipPath>
  </defs>
  <g>
    <circle cx="50.0" cy="43.0" r="15.0" fill="#12294A" stroke="#0A2240" stroke-width="3.0" stroke-linejoin="round"/>
    <polygon points="2.00,1.45 56.00,32.61 44.00,53.39 2.00,29.15" fill="#12294A" stroke="#0A2240" stroke-width="3.0" stroke-linejoin="round"/>
    <polygon points="98.00,1.45 44.00,32.61 56.00,53.39 98.00,29.15" fill="#12294A" stroke="#0A2240" stroke-width="3.0" stroke-linejoin="round"/>
  </g>
  <g>
    <circle cx="50.0" cy="43.0" r="15.0" fill="#12294A"/>
    <polygon points="2.00,1.45 56.00,32.61 44.00,53.39 2.00,29.15" fill="#12294A"/>
    <polygon points="98.00,1.45 44.00,32.61 56.00,53.39 98.00,29.15" fill="#12294A"/>
  </g>
  <g clip-path="url(#ms-wings)">
    <g stroke="#E8EDF5" stroke-width="5.5" stroke-linecap="butt">
      <line x1="-8.00" y1="0.29" x2="62.66" y2="41.07"/>
      <line x1="-8.00" y1="9.53" x2="58.66" y2="48.00"/>
      <line x1="-8.00" y1="18.77" x2="54.66" y2="54.93"/>
      <line x1="108.00" y1="0.29" x2="37.34" y2="41.07"/>
      <line x1="108.00" y1="9.53" x2="41.34" y2="48.00"/>
      <line x1="108.00" y1="18.77" x2="45.34" y2="54.93"/>
    </g>
  </g>
  <!-- The hub, over the stripes: they stop at its circumference. -->
  <circle cx="50.0" cy="43.0" r="15.0" fill="#12294A"/>
  <!-- Blue on blue: the field color, outlined in a lighter metallic blue. -->
  <polygon points="50.00,33.40 52.35,39.76 59.13,40.03 53.80,44.24 55.64,50.77 50.00,47.00 44.36,50.77 46.20,44.24 40.87,40.03 47.65,39.76"
           fill="none" stroke="#4E7FB8" stroke-width="1.8"
           stroke-linejoin="round"/>
</svg>
